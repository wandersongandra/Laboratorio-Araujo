es protéticos, ligas metálicas, vazamento, troquéis e gengivas artificiais são orçados à parte."}},{"@type":"Question","name":"O laboratório faz trabalhos que não aparecem no site?","acceptedAnswer":{"@type":"Answer","text":"Sim, conforme o caso. Mande a descrição pelo WhatsApp e o atendimento confirma se o trabalho é feito e passa o orçamento."}},{"@type":"Question","name":"Como faço o pagamento?","acceptedAnswer":{"@type":"Answer","text":"O pagamento deve ser feito até o dia 10 de cada mês. Financeiro: {{FINANCIAL_PHONE_DISPLAY}} ou WhatsApp {{FINANCIAL_WHATSAPP_DISPLAY}}."}},{"@type":"Question","name":"Vocês fazem zircônia, E-Max e barra de protocolo?","acceptedAnswer":{"@type":"Answer","text":"Sim. O laboratório faz facetas, coroas, restaurados e pontes em zircônia e E-Max, além de barra de protocolo até 6 elementos, barra clips e guia cirúrgico."}},{"@type":"Question","name":"Vocês fazem prótese flexível?","acceptedAnswer":{"@type":"Answer","text":"Sim. Parcial Flexite unilateral e bilateral, com os dentes orçados à parte."}},{"@type":"Question","name":"Vocês fazem overdenture com barra clips?","acceptedAnswer":{"@type":"Answer","text":"Sim. O laboratório faz barra clips de até 3 elementos para overdenture, além de barra de protocolo e guia cirúrgico."}},{"@type":"Question","name":"Vocês fazem aparelhos ortodônticos?","acceptedAnswer":{"@type":"Answer","text":"Sim. O laboratório confecciona todos os tipos e modelos de ortodontia e ortopedia, além de placas de bruxismo, clareamento, esporte e anti-ronco."}}]},{"@type":"BreadcrumbList","@id":"https://brilliant-cat-c5b6e9.netlify.app/perguntas-frequentes/#breadcrumb","itemListElement":[{"@type":"ListItem","position":1,"name":"Início","item":"https://brilliant-cat-c5b6e9.netlify.app/"},{"@type":"ListItem","position":2,"name":"Perguntas frequentes","item":"https://brilliant-cat-c5b6e9.netlify.app/perguntas-frequentes/"}]}]}</script>
